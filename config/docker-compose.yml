# Rode a partir da raiz do repositório:
#   docker compose -f config/docker-compose.yml up -d db redis
name: documentos-arena

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: arena
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Em desenvolvimento você pode rodar o Django direto no venv e subir apenas
  # os serviços db e redis.
  app:
    build:
      context: ..
      dockerfile: config/Dockerfile
      args:
        INSTALAR_DEV: "true"
    command: python manage.py runserver 0.0.0.0:8000
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://arena:arena@db:5432/arena
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: config/Dockerfile
      args:
        INSTALAR_DEV: "true"
    command: celery -A arena worker -l info
    working_dir: /app/src
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://arena:arena@db:5432/arena
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  dados_postgres:
