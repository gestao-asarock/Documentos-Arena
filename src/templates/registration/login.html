{% extends "base.html" %}

{% block titulo %}Entrar — Documentos Arena{% endblock %}

{% block conteudo %}
<div class="login">
  <h1 class="login__titulo">Documentos Arena</h1>
  <p class="login__subtitulo">ASAROCK Asset Management — FII ARENA</p>

  {% if form.errors %}
    <p class="aviso aviso--erro">Usuário ou senha inválidos.</p>
  {% endif %}

  <form method="post" class="formulario">
    {% csrf_token %}
    <label for="{{ form.username.id_for_label }}">Usuário</label>
    {{ form.username }}
    <label for="{{ form.password.id_for_label }}">Senha</label>
    {{ form.password }}
    <button type="submit" class="botao">Entrar</button>
  </form>
</div>
{% endblock %}
